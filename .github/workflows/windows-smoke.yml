name: Windows Install Smoke

# Issue #3: prove the documented one-line Windows install produces a
# working toolchain, without waiting for a physical machine. Runs the
# REAL installer chain (web/install.ps1 -> scripts/bootstrap.ps1 ->
# scripts/install.ps1 -Yes) on a hosted Windows runner, then smokes the
# installed CLI. Scheduled weekly + on installer changes, not on every
# PR (Windows minutes are expensive and the installer is slow).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "web/install.ps1"
      - "scripts/bootstrap.ps1"
      - "scripts/install.ps1"
  push:
    branches: [main]
    paths:
      - "web/install.ps1"
      - "scripts/bootstrap.ps1"
      - "scripts/install.ps1"
      - ".github/workflows/windows-smoke.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly Monday sanity: catches winget/choco drift

jobs:
  one-line-install:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run the documented one-liner (the PR's own installer)
        shell: powershell
        env:
          # The installer hands over to the interactive picker when it detects
          # a console. Belt and braces on top of that detection: a hung prompt
          # here would burn the job's whole timeout.
          AISWMM_NO_SETUP: "1"
          # On a pull request, install the PR's own installer. This pinned
          # `main` unconditionally, so the one check whose entire job is to
          # validate an installer change was validating the installer already
          # on main: a PR that fixed the installer failed, and a PR that broke
          # it would have passed. bootstrap clones with `git clone --branch`,
          # which takes a branch or tag, so a head ref works and a bare sha
          # would not. Fork PRs have no branch in this repo, hence the fallback.
          AISWMM_INSTALL_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || 'main' }}
        run: ./web/install.ps1

      - name: Smoke the installed CLI
        shell: powershell
        run: |
          $aiswmm = Join-Path $env:LOCALAPPDATA "agentic-swmm-workflow\.venv\Scripts\aiswmm.exe"
          if (-not (Test-Path $aiswmm)) { throw "aiswmm.exe missing at $aiswmm" }
          & $aiswmm --version
          if ($LASTEXITCODE -ne 0) { throw "aiswmm --version failed" }
          & $aiswmm capabilities
          if ($LASTEXITCODE -ne 0) { throw "aiswmm capabilities failed" }
          & $aiswmm doctor
          if ($LASTEXITCODE -ne 0) { throw "aiswmm doctor failed" }

      # A first install on a clean runner is the easy case, and it is all this
      # workflow used to cover. Every Windows install failure reported from the
      # field came from the SECOND run over an existing checkout, so exercise it:
      #   - npm writes mcp/<server>/package-lock.json. When such a file is
      #     untracked locally but tracked at the target ref, `git checkout`
      #     aborts; bootstrap did not check the exit code and reinstalled the
      #     stale tree while printing the new tag.
      #   - node_modules/ from the first run made the MCP step enumerate every
      #     nested dependency's package.json.
      - name: Re-run the one-liner over the existing install (upgrade path)
        shell: powershell
        env:
          AISWMM_NO_SETUP: "1"
          AISWMM_INSTALL_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || 'main' }}
        run: |
          $root = Join-Path $env:LOCALAPPDATA "agentic-swmm-workflow"
          $rel = "mcp/swmm-runner/package-lock.json"
          # Recreate the field state: the file exists on disk but is untracked
          # here, and is tracked at the ref we are about to check out.
          & git -C $root rm --cached -q -- $rel
          if ($LASTEXITCODE -ne 0) { throw "could not untrack $rel" }
          if (-not (Test-Path (Join-Path $root $rel))) { throw "$rel should still be on disk" }
          ./web/install.ps1
          if ($LASTEXITCODE -ne 0) { throw "second install run failed" }
          # If the checkout had been skipped, the file would still be untracked.
          & git -C $root ls-files --error-unmatch $rel
          if ($LASTEXITCODE -ne 0) { throw "checkout did not run: $rel is still untracked, so the install ran against a stale tree" }

      - name: Smoke the installed CLI again
        shell: powershell
        run: |
          $aiswmm = Join-Path $env:LOCALAPPDATA "agentic-swmm-workflow\.venv\Scripts\aiswmm.exe"
          & $aiswmm doctor
          if ($LASTEXITCODE -ne 0) { throw "aiswmm doctor failed after upgrade" }

  # Windows on ARM is where the install actually breaks, and nothing in this
  # matrix could see it: windows-latest is x64, so the one check that installs
  # on Windows has always had every wheel available to it. shapely and pyogrio
  # have never published a win_arm64 wheel (issue #414), so an ARM64
  # interpreter falls back to a source build and dies on a missing GDAL. The
  # installer is supposed to steer to an x64 interpreter instead; this is what
  # proves it does.
  arm-install:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Report the machine's interpreter inventory
        shell: powershell
        run: |
          "host arch: $env:PROCESSOR_ARCHITECTURE / ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"
          py -0p
          foreach ($v in @('-3.14','-3.13','-3.12','-3.11','-3.10')) {
            try { "$v -> " + (& py $v -c "import platform,sys; print(platform.machine(), sys.executable)" 2>$null) }
            catch { "$v -> absent" }
          }
          # A probe for an absent version leaves $LASTEXITCODE non-zero, and
          # the shell appends `exit $LASTEXITCODE`, so an inventory step that
          # worked perfectly reported failure and the job never reached the
          # install it exists to run.
          exit 0

      - name: Run the documented one-liner
        shell: powershell
        env:
          AISWMM_NO_SETUP: "1"
          AISWMM_INSTALL_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || 'main' }}
        run: ./web/install.ps1

      - name: Prove the geospatial stack imports
        shell: powershell
        run: |
          # The whole point. numpy alone passing is what the previous release
          # mistook for a working install.
          $py = Join-Path $env:LOCALAPPDATA "agentic-swmm-workflow\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "venv python missing at $py" }
          & $py -c "import platform, sys; print('venv:', platform.machine(), sys.version)"
          & $py -c "import numpy, matplotlib, pandas, shapely, pyogrio, geopandas, rasterio; print('all geospatial imports ok')"
          if ($LASTEXITCODE -ne 0) { throw "the installed environment cannot import the geospatial stack" }

      - name: Smoke the installed CLI
        shell: powershell
        run: |
          $aiswmm = Join-Path $env:LOCALAPPDATA "agentic-swmm-workflow\.venv\Scripts\aiswmm.exe"
          & $aiswmm --version
          if ($LASTEXITCODE -ne 0) { throw "aiswmm --version failed" }
          & $aiswmm doctor
          if ($LASTEXITCODE -ne 0) { throw "aiswmm doctor failed" }
