name: Docker Smoke

# Smoke the PUBLISHED image, not the laptop: pull what the Docker workflow
# pushed and drive it the way a user would. Runs after every Docker
# workflow (v* tags), on demand for any tag, and weekly against latest.
# Decided 2026-09-05: Docker Desktop on the developer's Mac could not start
# its engine VM (S60), so the image smoke lives here.

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to smoke (a v* tag, a version, or latest)"
        required: false
        default: "latest"
  schedule:
    - cron: "30 7 * * 1" # weekly, after the install smokes

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_REPO: ghcr.io/zhonghao1995/agentic-swmm-workflow
    steps:
      - name: Resolve the image tag
        id: tag
        shell: bash
        run: |
          tag="latest"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            head="${{ github.event.workflow_run.head_branch }}"
            if [[ "$head" == v* ]]; then tag="$head"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "smoking ${IMAGE_REPO}:${tag}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image
        run: docker pull "${IMAGE_REPO}:${{ steps.tag.outputs.tag }}"
      - name: The CLI reports its version
        run: docker run --rm "${IMAGE_REPO}:${{ steps.tag.outputs.tag }}" python3 -m agentic_swmm.cli --version
      - name: The engine is there
        run: docker run --rm "${IMAGE_REPO}:${{ steps.tag.outputs.tag }}" swmm5 --version
      - name: doctor runs inside the container
        run: docker run --rm "${IMAGE_REPO}:${{ steps.tag.outputs.tag }}" python3 -m agentic_swmm.cli doctor
      - name: The deterministic acceptance run completes
        run: docker run --rm -e AGENTIC_SWMM_RUN_ID=ci-smoke "${IMAGE_REPO}:${{ steps.tag.outputs.tag }}" acceptance
